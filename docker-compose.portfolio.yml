services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    ports:
      - "5432:5432"
    volumes:
      - research_db:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://research:research@db:5432/research
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  research_db:
